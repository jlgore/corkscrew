# Standalone Cargo project — intentionally NOT a workspace member.
#
# The sibling extension crate (../corkscrew-graph) compiles duckdb-rs with
# the `loadable-extension` feature, which leaves the C API dispatch table
# uninitialized when there is no host DuckDB process. That makes
# Rust-level unit tests against `Connection::open(...)` impossible from
# inside the extension crate.
#
# This crate gets around that by re-compiling the same pure-Rust source
# files (graph::schema, graph::loader, graph::cache) against duckdb-rs
# with the `bundled` feature, which links DuckDB statically into the test
# binary and provides a fully working C API.
[package]
name = "corkscrew-graph-tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
duckdb = { version = "1.10502.0", features = ["bundled", "vtab", "vtab-arrow"] }
anyhow = "1.0"
petgraph = { version = "0.6", features = ["serde-1"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
dashmap = "5.5"
lru = "0.12"
chrono = { version = "0.4", features = ["serde", "clock"] }
vf2 = "1.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.6"

[[bench]]
name = "graph_benchmarks"
harness = false
