name: Build and Publish

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
  CARGO_DUCKDB_EXT_VERSION: '0.5.0'
  DUCKDB_EXT_VERSION: 'v1.5.3'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for GoReleaser

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'

    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install Go protobuf plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Setup dependencies
      run: make deps

    - name: Generate protobuf code
      run: make generate-proto

    - name: Format and lint check
      run: |
        make fmt
        make lint || echo "Lint warnings detected but continuing..."

    - name: Run unit tests
      run: make test-unit

    - name: Build CLI and plugins
      run: make build

    - name: Test CLI binary
      run: ./build/bin/corkscrew --help

    - name: Run integration tests (dry run)
      run: make test-dry-run

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  build-graph-extension:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    name: build graph extension (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-latest
          - platform: osx_arm64
            runner: macos-latest
          - platform: windows_amd64
            runner: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo state
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/bin/cargo-duckdb-ext
          ~/.cargo/bin/cargo-duckdb-ext.exe
          extensions/corkscrew-graph/target
        key: cargo-${{ matrix.platform }}-graph-release-${{ env.CARGO_DUCKDB_EXT_VERSION }}-${{ hashFiles('extensions/corkscrew-graph/Cargo.lock') }}
        restore-keys: |
          cargo-${{ matrix.platform }}-graph-release-${{ env.CARGO_DUCKDB_EXT_VERSION }}-
          cargo-${{ matrix.platform }}-graph-release-

    - name: Install cargo-duckdb-ext-tools
      shell: bash
      run: |
        if ! command -v cargo-duckdb-ext >/dev/null 2>&1; then
          cargo install --locked cargo-duckdb-ext-tools --version "$CARGO_DUCKDB_EXT_VERSION"
        else
          echo "cargo-duckdb-ext already cached"
        fi

    - name: Build packaged graph extension
      working-directory: extensions/corkscrew-graph
      shell: bash
      run: |
        cargo duckdb-ext build \
          --duckdb-version "$DUCKDB_EXT_VERSION" \
          --duckdb-platform "${{ matrix.platform }}" \
          -- --release
        mkdir -p build
        asset="corkscrew_graph-${GITHUB_REF_NAME}-duckdb-${DUCKDB_EXT_VERSION}-${{ matrix.platform }}.duckdb_extension"
        cp target/release/corkscrew_graph.duckdb_extension "build/${asset}"

    - name: Verify extension footer
      shell: bash
      working-directory: extensions/corkscrew-graph
      run: |
        asset="corkscrew_graph-${GITHUB_REF_NAME}-duckdb-${DUCKDB_EXT_VERSION}-${{ matrix.platform }}.duckdb_extension"
        ls -la "build/${asset}"
        if ! grep -aq "${{ matrix.platform }}" "build/${asset}"; then
          echo "::error::Packaged extension missing platform marker ${{ matrix.platform }}"
          exit 1
        fi
        if ! grep -aq "$DUCKDB_EXT_VERSION" "build/${asset}"; then
          echo "::error::Packaged extension missing DuckDB version marker $DUCKDB_EXT_VERSION"
          exit 1
        fi

    - name: Upload graph extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: corkscrew-graph-extension-${{ matrix.platform }}
        path: extensions/corkscrew-graph/build/corkscrew_graph-${{ github.ref_name }}-duckdb-${{ env.DUCKDB_EXT_VERSION }}-${{ matrix.platform }}.duckdb_extension
        if-no-files-found: error
        retention-days: 30

  build-cli-release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    name: build CLI (${{ matrix.goos }}_${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            archive: corkscrew_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            archive: corkscrew_linux_arm64.tar.gz
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            archive: corkscrew_darwin_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            archive: corkscrew_darwin_arm64.tar.gz
          - goos: windows
            goarch: amd64
            runner: windows-latest
            archive: corkscrew_windows_amd64.zip
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'

    - name: Build native CLI
      shell: bash
      env:
        CGO_ENABLED: '1'
        TARGET_OS: ${{ matrix.goos }}
        TARGET_ARCH: ${{ matrix.goarch }}
      run: |
        test "$(go env GOOS)" = "$TARGET_OS"
        test "$(go env GOARCH)" = "$TARGET_ARCH"
        binary=corkscrew
        if [ "$TARGET_OS" = windows ]; then binary=corkscrew.exe; fi
        mkdir -p package
        go build -trimpath \
          -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=$GITHUB_SHA -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o "package/$binary" ./cmd/corkscrew
        cp README.md docs/AWS_SCANNING_DOCUMENTATION.md docs/AZURE_SCANNING_DOCUMENTATION.md package/
        cp -R plugins package/

    - name: Package Unix CLI
      if: matrix.goos != 'windows'
      shell: bash
      run: tar -C package -czf "${{ matrix.archive }}" .

    - name: Package Windows CLI
      if: matrix.goos == 'windows'
      shell: pwsh
      run: Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"

    - name: Upload CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
        path: ${{ matrix.archive }}
        if-no-files-found: error
        retention-days: 30

  release:
    needs: [test, build-graph-extension, build-cli-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write

    steps:
    - name: Download CLI artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: cli-*
        path: release-artifacts
        merge-multiple: true

    - name: Create checksums
      working-directory: release-artifacts
      run: sha256sum * > checksums.txt

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG_NAME: ${{ github.ref_name }}
      run: gh release create "$TAG_NAME" release-artifacts/* --generate-notes --title "$TAG_NAME"

  upload-graph-extension-assets:
    needs: [release, build-graph-extension]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
    - name: Download graph extension artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: corkscrew-graph-extension-*
        path: graph-extension-artifacts
        merge-multiple: true

    - name: Upload graph extensions to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG_NAME: ${{ github.ref_name }}
      run: gh release upload "$TAG_NAME" graph-extension-artifacts/*.duckdb_extension --clobber


  snapshot-release:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'

    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler

    - name: Install Go protobuf plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

    - name: Setup dependencies
      run: make deps

    - name: Generate protobuf code
      run: make generate-proto

    - name: Run GoReleaser in snapshot mode
      uses: goreleaser/goreleaser-action@v5
      with:
        distribution: goreleaser
        version: latest
        args: release --snapshot --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload snapshot artifacts
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-binaries
        path: dist/*
        retention-days: 30
