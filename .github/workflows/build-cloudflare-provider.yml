name: Build Cloudflare Provider

on:
  push:
    paths:
      - 'plugins/cloudflare-provider/**'
      - 'internal/providers/cloudflareauth/**'
      - 'internal/proto/**'
      - 'internal/shared/**'
      - '.github/workflows/build-cloudflare-provider.yml'
    branches: [ main ]
  pull_request:
    paths:
      - 'plugins/cloudflare-provider/**'
      - 'internal/providers/cloudflareauth/**'
      - 'internal/proto/**'
      - 'internal/shared/**'
      - '.github/workflows/build-cloudflare-provider.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v1.0.0-cloudflare.1)'
        required: false
        default: 'latest'
      create_release:
        description: 'Create a release for this plugin'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  workflow_call:
    inputs:
      version:
        description: 'Version to build'
        required: false
        default: 'latest'
        type: string
      create_release:
        description: 'Create a release for this plugin'
        required: false
        default: 'false'
        type: string

env:
  PLUGIN_NAME: cloudflare-provider
  PROVIDER_TYPE: cloudflare

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache-dependency-path: |
            go.sum
            plugins/${{ env.PLUGIN_NAME }}/go.sum

      # The generated protobuf code is committed under internal/proto, and the
      # plugin's go.mod replaces the core module with this checkout, so no
      # protoc step or `go mod tidy` is needed.
      - name: Vet and test
        working-directory: plugins/${{ env.PLUGIN_NAME }}
        run: |
          go vet ./...
          go test ./...

      - name: Test Cloudflare auth package
        run: go test ./internal/providers/cloudflareauth/...

      - name: Determine version
        id: version
        run: |
          # Handle both workflow_dispatch and workflow_call inputs
          INPUT_VERSION="${{ github.event.inputs.version || inputs.version }}"
          INPUT_CREATE_RELEASE="${{ github.event.inputs.create_release || inputs.create_release }}"

          if [ "$INPUT_VERSION" != "" ] && [ "$INPUT_VERSION" != "latest" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            # Use commit hash for non-release builds
            VERSION="v0.0.0-${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "create_release=${INPUT_CREATE_RELEASE}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
          echo "Create release: ${INPUT_CREATE_RELEASE}"

      - name: Build Cloudflare provider for multiple platforms
        run: |
          mkdir -p dist

          platforms=("linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64")

          for platform in "${platforms[@]}"; do
            IFS='/' read -r GOOS GOARCH <<< "$platform"
            echo "Building for $GOOS/$GOARCH..."

            output_name="${{ env.PLUGIN_NAME }}-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then
              output_name="${output_name}.exe"
            fi

            (cd plugins/${{ env.PLUGIN_NAME }} && \
              CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
                -ldflags="-s -w" \
                -o "../../dist/${output_name}" .)

            echo "✅ Built: dist/${output_name}"
          done

          # Corkscrew loads providers through their manifest, so ship it with the binaries.
          cp plugins/${{ env.PLUGIN_NAME }}/plugin.json dist/${{ env.PLUGIN_NAME }}-plugin.json

      - name: Test plugin binary
        run: ./dist/${{ env.PLUGIN_NAME }}-linux-amd64 -test

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-${{ steps.version.outputs.version }}
          path: |
            dist/${{ env.PLUGIN_NAME }}-*
            dist/checksums.txt
          retention-days: 30

      - name: Create Release
        if: steps.version.outputs.create_release == 'true' || startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: "Cloudflare Provider ${{ steps.version.outputs.version }}"
          body: |
            ## Cloudflare Provider Release ${{ steps.version.outputs.version }}

            ### 📦 Installation

            Corkscrew loads a provider from its directory under `~/.corkscrew/plugins/official/`,
            so install the binary for your platform next to its `plugin.json` manifest:

            ```bash
            VERSION=${{ steps.version.outputs.version }}
            PLATFORM=linux-amd64   # or linux-arm64, darwin-amd64, darwin-arm64
            DIR=~/.corkscrew/plugins/official/cloudflare
            mkdir -p "$DIR"
            curl -fL -o "$DIR/${{ env.PLUGIN_NAME }}" \
              https://github.com/${{ github.repository }}/releases/download/$VERSION/${{ env.PLUGIN_NAME }}-$PLATFORM
            curl -fL -o "$DIR/plugin.json" \
              https://github.com/${{ github.repository }}/releases/download/$VERSION/${{ env.PLUGIN_NAME }}-plugin.json
            chmod +x "$DIR/${{ env.PLUGIN_NAME }}"
            ```

            ### 🔍 Usage

            ```bash
            # Verify installation
            corkscrew plugin status cloudflare

            # Configure an API token with the scopes the scan needs
            corkscrew cloudflare auth plan --services zones,dns,workers,storage,data
            export CLOUDFLARE_API_TOKEN=...
            corkscrew cloudflare auth verify --services zones,dns,workers,storage,data

            # Scan
            corkscrew scan --provider cloudflare --services zones,dns,workers,storage,data
            ```

            ### 📋 Supported Cloudflare Resources

            - Accounts and zones
            - DNS records
            - Workers scripts, routes, and custom domains
            - R2 buckets, KV namespaces, and Queues
            - D1 databases, Durable Objects, and Secrets Store

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/previous-tag...${{ steps.version.outputs.version }}
          files: |
            dist/${{ env.PLUGIN_NAME }}-*
            dist/checksums.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}
