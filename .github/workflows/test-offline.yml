name: Test Build Offline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt-get update
        sudo apt-get install -y wget
        cd /tmp
        wget -q https://go.dev/dl/go1.21.3.linux-amd64.tar.gz
        sudo rm -rf /usr/local/go
        sudo tar -C /usr/local -xzf go1.21.3.linux-amd64.tar.gz
        echo "/usr/local/go/bin" >> $GITHUB_PATH
    
    - name: Verify Go installation
      run: /usr/local/go/bin/go version
    
    - name: Install dependencies
      run: /usr/local/go/bin/go mod tidy
    
    - name: Generate plugin registry
      run: |
        VERSION=${{ github.sha }}
        REPO=${{ github.repository }}
        ./scripts/generate-plugin-registry.sh "$VERSION" "$REPO" "plugins/registry.json"
    
    - name: Build CLI
      run: |
        cd cmd/corkscrew
        /usr/local/go/bin/go build -o ../../build/bin/corkscrew .
    
    - name: Build AWS plugin
      run: |
        mkdir -p build/bin
        cd plugins/aws-provider
        /usr/local/go/bin/go mod tidy
        /usr/local/go/bin/go build -tags="aws_services" -o ../../build/bin/aws-provider .
    
    - name: Build Azure plugin
      run: |
        cd plugins/azure-provider
        /usr/local/go/bin/go mod tidy
        /usr/local/go/bin/go build -o ../../build/bin/azure-provider .
    
    - name: Test CLI binary
      run: |
        ./build/bin/corkscrew --help
        ls -la build/bin/
    
    - name: Validate registry
      run: |
        if command -v jq >/dev/null; then
          echo "Registry validation:"
          jq '.' plugins/registry.json
          echo "Plugin count: $(jq '.plugins | length' plugins/registry.json)"
        else
          echo "jq not available, skipping JSON validation"
        fi