name: Test Build Offline

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true
    
    - name: Install protobuf compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler
    
    - name: Install Go protobuf plugins
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
    
    - name: Install dependencies
      run: go mod tidy

    - name: Check formatting
      run: |
        gofmt -w .
        git diff --exit-code
    
    - name: Generate protobuf code
      run: |
        make generate-proto
        git diff --exit-code internal/proto

    - name: Run tests
      run: go test ./...
    
    - name: Generate plugin registry
      run: |
        VERSION=${{ github.sha }}
        REPO=${{ github.repository }}
        ./scripts/generate-plugin-registry.sh "$VERSION" "$REPO" "plugins/registry.json"
    
    - name: Build CLI
      run: |
        mkdir -p build/bin
        cd cmd/corkscrew
        go build -o ../../build/bin/corkscrew .
    
    - name: Build AWS plugin
      run: |
        mkdir -p build/bin
        cd plugins/aws-provider
        go mod tidy
        go build -tags="aws_services" -o ../../build/bin/aws-provider .
    
    - name: Build Azure plugin
      run: |
        cd plugins/azure-provider
        go mod tidy
        go build -o ../../build/bin/azure-provider .
    
    - name: Test CLI binary
      run: |
        ./build/bin/corkscrew --help
        ls -la build/bin/
    
    - name: Validate registry
      run: |
        if command -v jq >/dev/null; then
          echo "Registry validation:"
          jq '.' plugins/registry.json
          echo "Plugin count: $(jq '.plugins | length' plugins/registry.json)"
        else
          echo "jq not available, skipping JSON validation"
        fi
